plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.17.0'
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    // JUnit plaform dan cucumber java
    testImplementation 'io.cucumber:cucumber-java:7.32.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.32.0'

    // Optional: WebDriverManager
    implementation 'io.github.bonigarcia:webdrivermanager:5.5.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


test {
    useJUnitPlatform()
}
